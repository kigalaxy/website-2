<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elena — Café · Bar · Gelateria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F1E4;
    --cream-2:#EFE6D2;
    --ink:#26241E;
    --bottle:#22402F;
    --bottle-dark:#152A1E;
    --gold:#C7973F;
    --gold-soft:#E4C989;
    --line: rgba(38,36,30,0.14);
    --shadow: 0 10px 30px rgba(21,42,30,0.10);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--gold-soft);}

  /* ---------- Header ---------- */
  header{
    position:sticky;
    top:0;
    z-index:50;
    background:var(--bottle);
    color:var(--cream);
    padding:22px 20px 16px;
    box-shadow:0 2px 18px rgba(0,0,0,0.18);
  }
  .header-inner{
    max-width:920px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brand-mark{
    width:52px;height:52px;border-radius:50%;
    border:1.5px solid var(--gold-soft);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.05rem;
    color:var(--gold-soft);
    flex-shrink:0;
  }
  .brand-text h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.5rem;
    margin:0;
    letter-spacing:0.01em;
  }
  .brand-text p{
    margin:2px 0 0;
    font-size:0.72rem;
    letter-spacing:0.14em;
    color:var(--gold-soft);
    text-transform:uppercase;
  }
  .lang-toggle{
    display:flex;
    border:1px solid rgba(247,241,228,0.35);
    border-radius:999px;
    overflow:hidden;
    flex-shrink:0;
  }
  .lang-toggle button{
    background:transparent;
    color:var(--cream);
    border:none;
    padding:8px 14px;
    font-family:'Inter',sans-serif;
    font-size:0.82rem;
    font-weight:600;
    cursor:pointer;
    transition:background .2s ease;
  }
  .lang-toggle button.active{
    background:var(--gold-soft);
    color:var(--bottle-dark);
  }

  /* ---------- Sector tabs ---------- */
  .sector-nav{
    max-width:920px;
    margin:18px auto 0;
    padding:0 20px;
    display:flex;
    gap:10px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .sector-nav::-webkit-scrollbar{display:none;}
  .sector-btn{
    flex:0 0 auto;
    background:var(--cream-2);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.95rem;
    padding:11px 20px;
    border-radius:999px;
    cursor:pointer;
    transition:all .2s ease;
    white-space:nowrap;
  }
  .sector-btn.active{
    background:var(--bottle);
    border-color:var(--bottle);
    color:var(--cream);
  }

  /* ---------- Main content ---------- */
  main{
    max-width:920px;
    margin:0 auto;
    padding:26px 20px 80px;
  }
  .sector-heading{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:2rem;
    margin:4px 0 22px;
    color:var(--bottle-dark);
  }

  /* Category accordion */
  .category{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    margin-bottom:14px;
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .category-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px;
    cursor:pointer;
    gap:12px;
  }
  .category-head h3{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:1.18rem;
    margin:0;
  }
  .chevron{
    width:20px;height:20px;
    flex-shrink:0;
    transition:transform .25s ease;
    color:var(--gold);
  }
  .category.open .chevron{transform:rotate(180deg);}

  .category-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
    border-top:1px solid transparent;
  }
  .category.open .category-body{
    border-top:1px solid var(--line);
  }

  .size-header{
    display:flex;
    justify-content:flex-end;
    gap:22px;
    padding:10px 20px 0;
    font-size:0.78rem;
    color:#8a8477;
    font-weight:600;
  }
  .size-header span{width:52px;text-align:right;}

  .item-list{padding:6px 20px 18px;}
  .item{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:14px;
    padding:12px 0;
    border-bottom:1px dashed var(--line);
  }
  .item:last-child{border-bottom:none;}
  .item-name{
    font-size:1.02rem;
    font-weight:500;
  }
  .item-note{
    display:block;
    font-size:0.82rem;
    color:#8a8477;
    font-weight:400;
    margin-top:2px;
  }
  .item-prices{
    display:flex;
    gap:22px;
    flex-shrink:0;
  }
  .item-prices span{
    width:52px;
    text-align:right;
    font-variant-numeric:tabular-nums;
    font-weight:600;
    color:var(--bottle-dark);
    white-space:nowrap;
  }
  .item-prices span.empty{color:transparent;}

  /* ---------- Bestell-Preis-Buttons ---------- */
  .item-prices button.price-btn{
    width:52px;
    text-align:right;
    font-variant-numeric:tabular-nums;
    font-weight:600;
    font-family:'Inter',sans-serif;
    color:var(--bottle-dark);
    white-space:nowrap;
    background:none;
    border:none;
    padding:6px 0 6px 6px;
    cursor:pointer;
    border-radius:8px;
    transition:background .15s ease, color .15s ease;
  }
  .item-prices button.price-btn:hover,
  .item-prices button.price-btn:focus-visible{
    background:var(--gold-soft);
    color:var(--bottle-dark);
    outline:none;
  }
  .item-qty{
    display:flex;
    align-items:center;
    gap:6px;
    margin-left:6px;
  }
  .item-qty button{
    width:24px;height:24px;
    border-radius:50%;
    border:1px solid var(--line);
    background:#fff;
    color:var(--bottle-dark);
    font-size:0.95rem;
    line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .item-qty span{
    min-width:16px;
    text-align:center;
    font-weight:700;
    font-size:0.9rem;
  }

  /* ---------- Warenkorb-Leiste ---------- */
  .cart-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:60;
    display:none;
    justify-content:center;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    pointer-events:none;
  }
  .cart-bar.visible{display:flex;}
  .cart-bar button{
    pointer-events:auto;
    background:var(--bottle);
    color:var(--cream);
    border:none;
    border-radius:999px;
    padding:14px 26px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:1rem;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 10px 26px rgba(0,0,0,0.28);
    cursor:pointer;
  }
  .cart-bar .count{
    background:var(--gold-soft);
    color:var(--bottle-dark);
    border-radius:999px;
    min-width:24px;
    height:24px;
    padding:0 7px;
    display:flex;align-items:center;justify-content:center;
    font-size:0.85rem;
  }

  /* ---------- Warenkorb-Modal ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(21,42,30,0.45);
    z-index:70;
    display:none;
    align-items:flex-end;
    justify-content:center;
  }
  .modal-overlay.visible{display:flex;}
  .modal-sheet{
    background:var(--cream);
    width:100%;
    max-width:560px;
    max-height:85vh;
    overflow-y:auto;
    border-radius:22px 22px 0 0;
    padding:22px 22px calc(22px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 40px rgba(0,0,0,0.3);
  }
  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .modal-header h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.4rem;
    margin:0;
  }
  .modal-close{
    background:none;border:none;
    font-size:1.4rem;
    color:var(--ink);
    cursor:pointer;
    padding:4px 8px;
  }
  .cart-line{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px 0;
    border-bottom:1px dashed var(--line);
  }
  .cart-line-name{font-weight:500;}
  .cart-line-size{
    display:block;
    font-size:0.8rem;
    color:#8a8477;
  }
  .cart-line-right{
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  .cart-line-price{
    font-weight:700;
    color:var(--bottle-dark);
    min-width:56px;
    text-align:right;
  }
  .cart-empty{
    text-align:center;
    color:#8a8477;
    padding:30px 10px;
  }
  .cart-total{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:16px 0 6px;
    font-family:'Fraunces',serif;
    font-size:1.3rem;
    font-weight:600;
    color:var(--bottle-dark);
  }
  .cart-note{
    font-size:0.82rem;
    color:#8a8477;
    margin:2px 0 16px;
  }
  .cart-submit{
    width:100%;
    background:var(--bottle);
    color:var(--cream);
    border:none;
    border-radius:14px;
    padding:15px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:1.02rem;
    cursor:pointer;
  }
  .cart-submit:disabled{
    background:var(--cream-2);
    color:#a39c8c;
    cursor:not-allowed;
  }
  .confirm-view{
    text-align:center;
    padding:20px 6px 6px;
  }
  .confirm-view .mark{
    font-size:2.6rem;
    margin-bottom:8px;
  }
  .confirm-view h4{
    font-family:'Fraunces',serif;
    font-size:1.3rem;
    margin:0 0 8px;
  }
  .confirm-view p{
    color:#5b5748;
    margin:0 0 20px;
  }
  .confirm-new{
    background:none;
    border:1.5px solid var(--bottle);
    color:var(--bottle);
    border-radius:999px;
    padding:11px 22px;
    font-weight:700;
    cursor:pointer;
  }

  /* Empty sector state */
  .empty-sector{
    text-align:center;
    padding:70px 20px;
    color:#6d6858;
  }
  .empty-sector .mark{
    font-family:'Fraunces',serif;
    font-size:2.6rem;
    color:var(--gold-soft);
    margin-bottom:10px;
  }
  .empty-sector p{
    font-size:1.02rem;
    max-width:340px;
    margin:0 auto;
  }

  footer{
    text-align:center;
    padding:22px 20px 34px;
    font-size:0.8rem;
    color:#8a8477;
  }

  @media (max-width:480px){
    .brand-text h1{font-size:1.25rem;}
    .sector-heading{font-size:1.6rem;}
    .item-prices{gap:14px;}
    .item-prices span, .size-header span{width:44px;}
  }

  @media (prefers-reduced-motion: reduce){
    .chevron, .category-body{transition:none;}
  }
</style>
</head>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">E</div>
      <div class="brand-text">
        <h1>Elena</h1>

    </div>
    <div class="lang-toggle">

    <span class="count" id="cart-count">0</span>
    <span id="cart-total-mini">0,00 €</span>
  </button>

<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this) closeCart()">

</div>

/* =========================================================
   RENDER-LOGIK — hier normalerweise nichts anfassen
   ========================================================= */

let currentLang = 'de';
let currentSector = 'getraenke';
const openCategories = new Set();

/* Warenkorb: key = "sector|catIdx|itemIdx|sizeNum" -> Menge.
   Es werden keine Zahlungsdaten verarbeitet — die Bestellung ist
   nur eine Übersicht, die der Kellner am Tisch abkassiert. */
const cart = {};
let orderSubmitted = false;

function cartKey(sector, catIdx, itemIdx, sizeNum){
  return `${sector}|${catIdx}|${itemIdx}|${sizeNum}`;
}

function cartQty(sector, catIdx, itemIdx, sizeNum){
  return cart[cartKey(sector, catIdx, itemIdx, sizeNum)] || 0;
}

function addToCart(sector, catIdx, itemIdx, sizeNum){
  const key = cartKey(sector, catIdx, itemIdx, sizeNum);
  cart[key] = (cart[key] || 0) + 1;
  render();
}

function decFromCart(sector, catIdx, itemIdx, sizeNum){
  const key = cartKey(sector, catIdx, itemIdx, sizeNum);
  if(!cart[key]) return;
  cart[key] -= 1;
  if(cart[key] <= 0) delete cart[key];
  render();
}

function parsePrice(str){
  if(!str) return 0;
  return parseFloat(String(str).replace(',', '.')) || 0;
}

function formatPrice(num){
  const withComma = currentLang === 'de';
  const fixed = num.toFixed(2);
  return (withComma ? fixed.replace('.', ',') : fixed) + ' €';
}

function getCartEntries(){
  const data = MENU[currentLang];
  return Object.keys(cart).map(key => {
    const [sector, catIdxStr, itemIdxStr, sizeNumStr] = key.split('|');
    const catIdx = parseInt(catIdxStr, 10);
    const itemIdx = parseInt(itemIdxStr, 10);
    const sizeNum = parseInt(sizeNumStr, 10);
    const s = data.sectors[sector];
    if(!s || s.type !== 'categories') return null;
    const cat = s.categories[catIdx];
    if(!cat) return null;
    const item = cat.items[itemIdx];
    if(!item) return null;
    const priceStr = sizeNum === 2 ? item.p2 : item.p1;
    const sizeLabel = sizeNum === 2 ? cat.size2 : cat.size1;
    return {
      key, sector, catIdx, itemIdx, sizeNum,
      name: item.name,
      sizeLabel: sizeLabel || '',
      price: parsePrice(priceStr),
      qty: cart[key]
    };
  }).filter(Boolean);
}

function cartCount(){
  return Object.values(cart).reduce((a,b) => a+b, 0);
}

function cartTotal(){
  return getCartEntries().reduce((sum, e) => sum + e.price * e.qty, 0);
}

function openCart(){
  orderSubmitted = false;
  renderCartBar();
  renderModal();
  document.getElementById('modal-overlay').classList.add('visible');
}

function closeCart(){
  document.getElementById('modal-overlay').classList.remove('visible');
}

function submitOrder(){
  if(cartCount() === 0) return;
  orderSubmitted = true;
  renderModal();
}

function startNewOrder(){
  Object.keys(cart).forEach(k => delete cart[k]);
  orderSubmitted = false;
  closeCart();
  render();
}

function renderCartBar(){
  const bar = document.getElementById('cart-bar');
  const count = cartCount();
  bar.classList.toggle('visible', count > 0);
  document.getElementById('cart-count').textContent = count;
  document.getElementById('cart-total-mini').textContent = formatPrice(cartTotal());
  const label = bar.querySelector('[data-i18n="cartLabel"]');
  if(label) label.textContent = MENU[currentLang].cartLabel;
}

function renderModal(){
  const data = MENU[currentLang];
  const sheet = document.getElementById('modal-sheet');
  const entries = getCartEntries();

  if(orderSubmitted){
    sheet.innerHTML = `
      <div class="confirm-view">
        <div class="mark">✓</div>
        <h4>${data.confirmTitle}</h4>
        <p>${data.confirmText}</p>
        <button class="confirm-new" onclick="startNewOrder()">${data.confirmNew}</button>
      </div>`;
    return;
  }

  const linesHTML = entries.length ? entries.map(e => `
    <div class="cart-line">
      <div>
        <span class="cart-line-name">${e.name}</span>
        ${e.sizeLabel ? `<span class="cart-line-size">${e.sizeLabel}</span>` : ''}
      </div>
      <div class="cart-line-right">
        <span class="item-qty">
          <button onclick="decFromCart('${e.sector}',${e.catIdx},${e.itemIdx},${e.sizeNum})">−</button>
          <span>${e.qty}</span>
          <button onclick="addToCart('${e.sector}',${e.catIdx},${e.itemIdx},${e.sizeNum})">+</button>
        </span>
        <span class="cart-line-price">${formatPrice(e.price * e.qty)}</span>
      </div>
    </div>
  `).join('') : `<div class="cart-empty">${data.cartEmpty}</div>`;

  sheet.innerHTML = `
    <div class="modal-header">
      <h3>${data.cartTitle}</h3>
      <button class="modal-close" onclick="closeCart()">✕</button>
    </div>
    ${linesHTML}
    ${entries.length ? `
      <div class="cart-total"><span>${data.cartTotalLabel}</span><span>${formatPrice(cartTotal())}</span></div>
      <p class="cart-note">${data.cartNote}</p>
      <button class="cart-submit" onclick="submitOrder()">${data.cartSubmit}</button>
    ` : ''}
  `;
}

function setLang(lang){
  currentLang = lang;
  document.getElementById('btn-de').classList.toggle('active', lang === 'de');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.documentElement.lang = lang;
  render();
}

function setSector(key){
  currentSector = key;
  render();
}

function toggleCategory(idx){
  if(openCategories.has(idx)) openCategories.delete(idx);
  else openCategories.add(idx);
  render();
}

function render(){
  const data = MENU[currentLang];
  document.querySelector('[data-i18n="tagline"]').textContent = data.tagline;
  document.querySelector('[data-i18n="footer"]').textContent = data.footer;

  const nav = document.getElementById('sector-nav');
  nav.innerHTML = '';
  Object.keys(data.sectors).forEach(key => {
    const s = data.sectors[key];
    const btn = document.createElement('button');
    btn.className = 'sector-btn' + (key === currentSector ? ' active' : '');
    btn.textContent = s.label;
    btn.onclick = () => setSector(key);
    nav.appendChild(btn);
  });

  const sector = data.sectors[currentSector];
  document.getElementById('sector-heading').textContent = sector.label;

  const content = document.getElementById('sector-content');
  content.innerHTML = '';

  if(sector.type === 'empty'){
    const div = document.createElement('div');
    div.className = 'empty-sector';
    div.innerHTML = `<div class="mark">···</div><p>${sector.emptyText}</p>`;
    content.appendChild(div);
    renderCartBar();
    if(document.getElementById('modal-overlay').classList.contains('visible')){
      renderModal();
    }
    return;
  }

  sector.categories.forEach((cat, idx) => {
    const isOpen = openCategories.has(idx);
    const wrap = document.createElement('div');
    wrap.className = 'category' + (isOpen ? ' open' : '');

    const head = document.createElement('div');
    head.className = 'category-head';
    head.onclick = () => toggleCategory(idx);
    head.innerHTML = `
      <h3>${cat.name}</h3>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    `;
    wrap.appendChild(head);

    const body = document.createElement('div');
    body.className = 'category-body';

    let sizeHeaderHTML = '';
    if(cat.size1 || cat.size2){
      sizeHeaderHTML = `<div class="size-header"><span>${cat.size1 || ''}</span><span>${cat.size2 || ''}</span></div>`;
    }

    const itemsHTML = cat.items.map((it, itemIdx) => {
      const renderSlot = (priceStr, sizeNum) => {
        if(!priceStr) return `<span class="empty">-</span>`;
        const qty = cartQty(currentSector, idx, itemIdx, sizeNum);
        if(qty > 0){
          return `<span class="item-qty">
            <button onclick="decFromCart('${currentSector}',${idx},${itemIdx},${sizeNum})">−</button>
            <span>${qty}</span>
            <button onclick="addToCart('${currentSector}',${idx},${itemIdx},${sizeNum})">+</button>
          </span>`;
        }
        return `<button class="price-btn" onclick="addToCart('${currentSector}',${idx},${itemIdx},${sizeNum})">${priceStr}</button>`;
      };
      const p1 = renderSlot(it.p1, 1);
      const p2 = (cat.size2 !== undefined) ? renderSlot(it.p2, 2) : '';
      return `
        <div class="item">
          <div class="item-name">${it.name}${it.note ? `<span class="item-note">${it.note}</span>` : ''}</div>
          <div class="item-prices">${p1}${p2}</div>
        </div>`;
    }).join('');

    body.innerHTML = sizeHeaderHTML + `<div class="item-list">${itemsHTML}</div>`;
    wrap.appendChild(body);

    if(isOpen){
      body.style.maxHeight = '2000px';
    }

    content.appendChild(wrap);
  });

  renderCartBar();
  if(document.getElementById('modal-overlay').classList.contains('visible')){
    renderModal();
  }
}

render();
</script>
